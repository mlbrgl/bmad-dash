[project]
name = "bmad-dash"
version = "0.1.0"
description = "Local dashboard listing a BMad project's initiatives and the worktrees working on them."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.11.1",
]

[project.scripts]
bmad-dash = "bmad_dash.server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmad_dash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
